<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model</title>
    <script type="module" src="./model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
        model-viewer { width: 100vw; height: 100vh; }
        model-viewer::part(default-progress-bar) {
            display: none;
        }
    </style>
</head>
<body>
    <model-viewer
        id="robot-model"
        src="https://appassets.androidplatform.net/dynamic/model.glb"
        alt="A 3D model"
        environment-image="https://appassets.androidplatform.net/dynamic/hdr.hdr"
        auto-rotate
        camera-controls
        disable-tap
        disable-pan
        disable-zoom
        interaction-prompt="none"
        max-camera-orbit="auto auto 300%"
    >
    </model-viewer>
</body>

<script>
    const modelViewer = document.querySelector('#robot-model');
    function initFromUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const orbit = params.get('orbit');

        if (orbit) {
            // 暂时关闭自动旋转，否则会覆盖初始角度
            modelViewer.setAttribute('camera-orbit', orbit)
        }
    }
    initFromUrlParams()
</script>
</html>
